[package]
name = "comarchy"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[test]]
name = "acceptance"
harness = false

[dependencies]
landlock = "0.4.7"
libc = "0.2.189"
relm4 = { version = "0.11.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
