[package]
name = "rust-commander"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[test]]
name = "acceptance"
harness = false

[dependencies]
crc32fast = "1.5.2"
flate2 = "1.1.10"
gtk4 = { version = "0.11.5", features = ["v4_10"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
landlock = "0.4.7"
libc = "0.2.189"
relm4 = { version = "0.11.0", features = ["macros"] }
resvg = { version = "0.48", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tar = "0.4.45"
toml = "1.1.6"
unrar-ng = "0.7"
unrar-ng-sys = { version = "0.7.7", default-features = false, features = ["std"] }
vte4 = "0.10"
zip = "8"
