name: Release

# Every push to master builds a .deb and a Fedora 44 .rpm, publishes a GitHub release
# and updates the apt and dnf repos on gh-pages.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["**.md", ".cursor/**", ".github/**", "LICENSE", "img/screenshot.png", "img/quick-view.png", "img/quick-edit.png", "img/thumbnails.jpg"]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    # A manual run from another branch must not publish.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gh gnupg apt-utils dpkg-dev debhelper build-essential cargo rustc pkg-config libgtk-4-dev libvte-2.91-gtk4-dev

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Major.minor comes from Cargo.toml, the patch is the commit count, so every push is a new version.
      - name: Set version
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*/\1/p' Cargo.toml | head -n 1)
          version="$base.$(git rev-list --count HEAD)"
          sed -i "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          # Cargo.lock must follow, the package build uses --locked.
          perl -0pi -e "s/(name = \"rust-commander\"\nversion = )\"[^\"]*\"/\$1\"$version\"/" Cargo.lock
          printf 'rust-commander (%s-1) unstable; urgency=medium\n\n  * Automated release.\n\n -- Rust Commander <sysopt@protonmail.com>  %s\n\n%s\n' \
            "$version" "$(date -R)" "$(cat debian/changelog)" > debian/changelog
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A failing test stops the release before anything is published.
      - name: Test
        run: cargo test --locked --lib

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: GitHub release
        run: |
          deb=$(ls ../rust-commander_*_amd64.deb)
          gh release create "v${{ steps.version.outputs.version }}" "$deb" --target "$GITHUB_SHA" --generate-notes --latest

      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages

      - name: Update apt repository
        working-directory: pages
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          echo "$APT_GPG_KEY" | gpg --batch --import
          # Only the newest package stays, apt never needs the older ones.
          rm -f rust-commander_*.deb pool/main/r/rust-commander/*.deb
          cp ../../rust-commander_*_amd64.deb pool/main/r/rust-commander/
          dir=dists/resolute/main/binary-amd64
          mkdir -p "$dir"
          apt-ftparchive packages pool > "$dir/Packages"
          gzip -9kf "$dir/Packages"
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Rust Commander" \
            -o APT::FTPArchive::Release::Label="Rust Commander" \
            -o APT::FTPArchive::Release::Suite=resolute \
            -o APT::FTPArchive::Release::Codename=resolute \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="Rust Commander" \
            release dists/resolute > Release.tmp
          mv Release.tmp dists/resolute/Release
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" --default-key B203CAEB2B841D3A "$@"; }
          sign -abs -o dists/resolute/Release.gpg dists/resolute/Release
          sign --clearsign -o dists/resolute/InRelease dists/resolute/Release
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "apt: ${{ steps.version.outputs.version }}"
          git push

  rpm:
    needs: release
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y git rpm-build rpm-sign createrepo_c cargo rust pkgconf-pkg-config gcc gtk4-devel vte291-gtk4-devel gnupg2 perl
          # gh is not in the Fedora repos.
          dnf config-manager addrepo --from-repofile=https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Same version as the .deb: major.minor from Cargo.toml, patch is the commit count.
      - name: Set version
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*/\1/p' Cargo.toml | head -n 1)
          version="$base.$(git rev-list --count HEAD)"
          sed -i "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          perl -0pi -e "s/(name = \"rust-commander\"\nversion = )\"[^\"]*\"/\$1\"$version\"/" Cargo.lock
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p "$HOME/rpmbuild/SOURCES"
          tar --exclude .git --exclude target --exclude debian/target --exclude debian/cargo-home \
            -czf "$HOME/rpmbuild/SOURCES/rust-commander-${version}.tar.gz" \
            --transform "s,^\./,rust-commander-${version}/," .
          rpmbuild -bb packaging/fedora/rust-commander.spec --define "ver ${version}"

      - name: GitHub release
        run: |
          rpm=$(ls "$HOME/rpmbuild/RPMS/x86_64"/rust-commander-*.rpm)
          gh release upload "v${{ steps.version.outputs.version }}" "$rpm"

      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages

      - name: Update dnf repository
        working-directory: pages
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          echo "$APT_GPG_KEY" | gpg --batch --import
          install -d "$HOME/.gnupg" rpm/fedora/44/x86_64
          chmod 700 "$HOME/.gnupg"
          printf 'allow-loopback-pinentry\n' > "$HOME/.gnupg/gpg-agent.conf"
          printf '%s\n' "$APT_GPG_PASSPHRASE" > "$HOME/.gnupg/pass"
          chmod 600 "$HOME/.gnupg/pass"
          gpgconf --kill gpg-agent || true
          cat > "$HOME/.rpmmacros" <<EOF
          %_signature gpg
          %_gpg_name B203CAEB2B841D3A
          %_gpg_path $HOME/.gnupg
          %_gpg_sign_cmd_extra_args --batch --yes --pinentry-mode loopback --passphrase-file $HOME/.gnupg/pass
          EOF
          rm -f rpm/fedora/44/x86_64/rust-commander-*.rpm
          cp "$HOME/rpmbuild/RPMS/x86_64"/rust-commander-*.rpm rpm/fedora/44/x86_64/
          cp "$GITHUB_WORKSPACE/packaging/fedora/rust-commander.repo" rpm/rust-commander.repo
          # Sign before createrepo, the signature changes the file.
          rpmsign --addsign rpm/fedora/44/x86_64/rust-commander-*.rpm
          createrepo_c rpm/fedora/44/x86_64
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" --default-key B203CAEB2B841D3A "$@"; }
          sign --detach-sign --armor -o rpm/fedora/44/x86_64/repodata/repomd.xml.asc rpm/fedora/44/x86_64/repodata/repomd.xml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "dnf: ${{ steps.version.outputs.version }}"
          git push
